        {"@type":"Question","name":"Quanto custa o plano de saúde Hapvida infantil hoje?","acceptedAnswer":{"@type":"Answer","text":"Na modalidade empresarial, a faixa de 0 a 18 anos é a mais barata da tabela. O valor final depende da cidade, do produto contratado e da coparticipação escolhida: a tabela no topo da página compara as quatro combinações mais procuradas em quatro praças da rede própria."}},
        {"@type":"Question","name":"O valor do plano infantil muda conforme a idade da criança?","acceptedAnswer":{"@type":"Answer","text":"Não. A ANS organiza os preços em dez faixas etárias e a primeira cobre dos 0 aos 18 anos inteiros. Um bebê e um adolescente de 17 pagam o mesmo. A primeira mudança de faixa acontece aos 19 anos."}},
        {"@type":"Question","name":"Dá para contratar o plano infantil só para a criança, sem os pais?","acceptedAnswer":{"@type":"Answer","text":"Sim. Um dos pais assina como responsável financeiro e apenas a criança entra como beneficiária. É comum em famílias em que os adultos já têm plano pela empresa e falta cobrir só o filho."}},
        {"@type":"Question","name":"Qual a diferença entre coparticipação total e parcial no plano infantil?","acceptedAnswer":{"@type":"Answer","text":"Na total, a mensalidade é menor e a família paga uma taxa a cada atendimento. Na parcial, a mensalidade é um pouco maior e a taxa por uso é reduzida. Criança que vai muito ao pediatra costuma sair melhor na parcial."}},
        {"@type":"Question","name":"Quanto se paga de coparticipação por consulta e exame no plano infantil?","acceptedAnswer":{"@type":"Answer","text":"Fora das capitais de tabela própria valem os valores da tabela de demais capitais, cobrados por consulta eletiva e por exame simples. Internação, cirurgia e parto são isentos de coparticipação em todas as modalidades."}},
        {"@type":"Question","name":"O que muda entre o plano infantil ambulatorial e o completo?","acceptedAnswer":{"@type":"Answer","text":"O ambulatorial cobre consulta, exame e pronto atendimento. O Nosso Plano acrescenta internação, cirurgia e UTI. Para criança pequena, a diferença aparece na primeira bronquiolite que exige leito."}},
        {"@type":"Question","name":"O recém-nascido entra no plano infantil sem cumprir carência?","acceptedAnswer":{"@type":"Answer","text":"Sim, desde que um dos pais já tenha plano com cobertura obstétrica e o bebê seja inscrito em até 30 dias corridos do parto. O direito está na Lei 9.656/1998, art. 12, III, \"b\"."}},
        {"@type":"Question","name":"O que acontece com o plano infantil se eu perder o prazo de 30 dias?","acceptedAnswer":{"@type":"Answer","text":"A criança passa a ser tratada como beneficiário novo e cumpre os prazos normais do contrato, inclusive para internação. Por isso a inscrição do bebê deve ser resolvida ainda na primeira semana."}},
        {"@type":"Question","name":"O plano infantil cobre fonoaudiologia, terapia ocupacional e psicologia?","acceptedAnswer":{"@type":"Answer","text":"Sim, conforme o Rol de Procedimentos da ANS e mediante indicação médica. São terapias procuradas por famílias de crianças com atraso de fala ou dificuldade motora, e têm coparticipação por sessão fora das capitais de tabela própria."}},
        {"@type":"Question","name":"O plano infantil cobre atendimento odontológico da criança?","acceptedAnswer":{"@type":"Answer","text":"A cobertura odontológica é contratada como plano à parte ou combinada, conforme a praça. Inclui consulta, limpeza, flúor e tratamento com odontopediatra. Confirme no contrato se já está inclusa antes de assinar."}},
        {"@type":"Question","name":"Onde a criança do plano infantil é atendida em uma urgência?","acceptedAnswer":{"@type":"Answer","text":"Nos prontos atendimentos da rede própria, que funcionam 24 horas. A cobertura de urgência vale após 24 horas de contrato. Vale localizar a unidade mais próxima de casa antes de precisar dela."}},
        {"@type":"Question","name":"Quem tem MEI consegue contratar o plano infantil empresarial?","acceptedAnswer":{"@type":"Answer","text":"Sim. Com CNPJ ativo, inclusive MEI, a contratação parte de 2 vidas. Em muitas configurações o titular é o adulto responsável pelo CNPJ e a criança entra como dependente."}},
        {"@type":"Question","name":"Até que idade o filho fica como dependente no plano infantil?","acceptedAnswer":{"@type":"Answer","text":"O limite de idade do dependente é definido em contrato e varia conforme a modalidade. Confirme essa cláusula antes de assinar, principalmente se o filho já for adolescente."}},
        {"@type":"Question","name":"Posso incluir enteado ou filho adotivo no plano infantil?","acceptedAnswer":{"@type":"Answer","text":"Sim, com a comprovação do vínculo. Para filho adotivo, vale a mesma proteção de prazo do recém-nascido, contada a partir da guarda ou da adoção."}},
        {"@type":"Question","name":"O plano infantil da Hapvida cobre cirurgia?","acceptedAnswer":{"@type":"Answer","text":"Sim, nos produtos com cobertura hospitalar, seguindo o Rol da ANS e os prazos de carência do contrato. O plano exclusivamente ambulatorial não cobre cirurgia."}},
