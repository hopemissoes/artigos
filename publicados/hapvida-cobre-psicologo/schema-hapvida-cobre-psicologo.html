        {
          "@type": "Question",
          "name": "Hapvida cobre psicólogo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Todos os planos Hapvida com cobertura ambulatorial cobrem sessões com psicólogo. Isso inclui as linhas Nosso Plano, Mix, Pleno, Smart, Advance, Premium, Infinity e NotreLife. A cobertura é obrigatória por lei, conforme Rol de Procedimentos da ANS."
          }
        },
        {
          "@type": "Question",
          "name": "Quantas sessões de psicólogo o Hapvida cobre por ano?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Desde agosto de 2022 (RN 541/2022 da ANS), não existe mais limite de sessões. A cobertura é ilimitada para qualquer condição de saúde com CID, desde que haja prescrição médica. O médico assistente define a quantidade necessária."
          }
        },
        {
          "@type": "Question",
          "name": "Qual a carência para psicólogo no Hapvida?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A primeira consulta de avaliação tem carência de 30 dias. A terapia contínuada (sessões regulares) tem carência de 180 dias. Em urgência/emergência psiquiátrica, a carência é de apenas 24 horas."
          }
        },
        {
          "@type": "Question",
          "name": "Hapvida cobre terapia online com psicólogo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O Hapvida oferece telepsicologia com mais de 40 mil atendimentos por mes. Agendamento pela Central (11) 4090-1740 (seg-sex 8h-20h) ou pelo app Hapvida. A ANS e o CFP determinam que teleterapia tem cobertura equivalente ao presencial."
          }
        },
        {
          "@type": "Question",

            "@type": "Answer",
            "text": "Sim. A cobertura inclui todas as faixas etárias. Para TEA (Transtorno do Espectro Autista), as sessões são ilimitadas desde 2021 (RN 469/2021). Para TDAH e outras condições, a cobertura segue a RN 541/2022 — também ilimitada com CID."
          }
        },
        {
          "@type": "Question",
          "name": "Como marcar psicólogo pelo Hapvida?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Primeiro, consulte um clínico geral ou psiquiatra para obter encaminhamento com CID. Depois, agende sessão pelo app Hapvida (Guia Médico → Psicologia), Portal do Beneficiário ou Central de Marcacao. Para telepsicologia: (11) 4090-1740."
          }

          "@type": "Question",

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O Hapvida/GNDI exige encaminhamento médico com CID para cobertura de sessões de psicoterapia. A boa noticia é que você pode obter esse encaminhamento por teleconsulta 24h, sem sair de casa."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto tempo demora para conseguir psicólogo no Hapvida?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O prazo máximo da ANS é de 10 dias úteis para agendamento. Considerando a consulta médica para encaminhamento, o tempo total até a primeira sessão é de 15 a 20 dias. Pela telepsicologia, o prazo pode ser menor."
          }
        },

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A coparticipação por sessão de psicoterapia segue a tabela vigente do plano, com valor menor no grupo Norte/Nordeste/Sul/Centro-Oeste e maior no grupo São Paulo e Belo Horizonte. A consulta de avaliação tem valor próprio e a internação psiquiátrica é isenta de coparticipação."
          }
        },

          "@type": "Question",

        },

          }
        },
        {
          "@type": "Question",
          "name": "O que é a Linha de Cuidado em Saúde Mental do Hapvida?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "É um programa pioneiro na América Latina com 4 pilares: Urgência (teleinterconsulta psiquiátrica em tempo real), Internação (equipe multidisciplinar), Pós-Alta (telemonitoramento 90+ dias, 11% redução reinternações) e Ambulatório. Presente em 160+ unidades, 22 estados. 100% gratuito."

        },

          }
        },
        {

          }
        },
        {
          "@type": "Question",
          "name": "O Hapvida cobre psicólogo em qualquer cidade do Brasil?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Hapvida está presente em todos os estados brasileiros. A cobertura presencial depende da abrangência do seu plano (regional ou nacional). A telepsicologia amplia o acesso para beneficiários em cidades com oferta presencial limitada. Em urgência psiquiátrica, o atendimento é garantido em qualquer localidade."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona a telepsicologia do Hapvida?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Acesse o Portal de Teleconsultas com CPF e data de nascimento, escolha Psicologia, selecione profissional, data e hora. No dia, valide biometria facial e entre na sala virtual. Receitas e atestados são enviados por SMS. Central: (11) 4090-1740."
          }
        },
        {
          "@type": "Question",
          "name": "O que fazer se o Hapvida negar cobertura de psicólogo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Peça a negativa por escrito. Você pode recorrer a ANS (0800 701 9656), Procon ou buscar orientação jurídica. Desde a RN 541/2022, a cobertura é obrigatória e ilimitada com CID — a negativa pode configurar prática abusiva. Ouvidoria Hapvida: 0800 280-9130 (N/NE) ou 0800 018-3456 (S/SE/CO)."
          }
        },
        {
          "@type": "Question",
          "name": "Hapvida cobre terapia para ansiedade e depressão?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Ansiedade e depressão possuem CIDs específicos (F41 e F32/F33) e estão plenamente cobertas. As sessões são ilimitadas desde a RN 541/2022. O Hapvida ainda oferece as Linhas de Cuidado em Saúde Mental para acompanhamento integrado."
          }
        },
        {
          "@type": "Question",
          "name": "Qual a diferença entre coparticipação total é parcial para quem faz terapia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Na coparticipação total, você paga por qualquer uso (consultas, exames, terapias). Na parcial, consultas e exames básicos são isentos — você paga apenas em terapias e procedimentos. O valor da sessão de psicologia é o mesmo nas duas modalidades."
          }
